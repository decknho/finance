<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle Financeiro</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
</head>

<body>

<div class="container">

    <aside class="sidebar">

        <a href="index.html" class="logo" aria-label="Finance - início">
            <span class="logo-icon" aria-hidden="true">
                <span></span><span></span><span></span>
            </span>
            <span class="logo-name">Finance<span>.</span></span>
        </a>
        
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="controle.html" class="active">Controle</a>
            <a href="simulador.html">Simulador</a>
            <a href="educacao.html">Educação</a>
        </nav>

    </aside>

    <main class="main">

        <header class="header">
            <h1>Controle Financeiro</h1>
        </header>

        <section class="form-section">

            <h2>Adicionar movimentação</h2>

            <div class="form">

                <label for="descricao">Descrição</label>

                <input
                    id="descricao"
                    type="text"
                    placeholder="Ex: Salário, aluguel, supermercado..."
                >


                <label for="valor">Valor</label>

                <input
                    id="valor"
                    type="number"
                    step="0.01"
                    min="0"
                    placeholder="Digite o valor"
                >


                <label for="tipo">Tipo</label>

                <select id="tipo">

                    <option value="receita">
                        Receita
                    </option>

                    <option value="despesa">
                        Despesa
                    </option>

                </select>


                <label for="categoria">Categoria</label>

                <select id="categoria" class="form select">

                    <option value="Salário">
                        Salário
                    </option>

                    <option value="Renda Extra">
                        Renda Extra
                    </option>

                    <option value="Alimentação">
                        Alimentação
                    </option>

                    <option value="Moradia">
                        Moradia
                    </option>

                    <option value="Transporte">
                        Transporte
                    </option>

                    <option value="Lazer">
                        Lazer
                    </option>

                    <option value="Educação">
                        Educação
                    </option>

                    <option value="Investimentos">
                        Investimentos
                    </option>

                    <option value="Outros">
                        Outros
                    </option>

                </select>


                <div class="buttons center">

                    <button
                        type="button"
                        class="btn salvar"
                        onclick="adicionarMovimentacao()"
                    >
                        Adicionar
                    </button>

                </div>

            </div>

        </section>


        <section class="form-section">

            <h2>Movimentações</h2>

            <br>

            <div class="lista-movimentacoes" id="listaMovimentacoes">
                
                <p>
                    Nenhuma movimentação cadastrada.
                </p>

            </div>

        </section>

    </main>

</div>


<script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Investimentos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
</head>

<body>

<div class="container">

    <aside class="sidebar">

        <a href="index.html" class="logo" aria-label="Finance - início">
            <span class="logo-icon" aria-hidden="true">
                <span></span><span></span><span></span>
            </span>
            <span class="logo-name">Finance<span>.</span></span>
        </a>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="controle.html">Controle</a>
            <a href="simulador.html" class="active">Simulador</a>
            <a href="educacao.html">Educação</a>
        </nav>

    </aside>

    <main class="main">

        <header class="header">
            <h1>Simulador de Investimentos</h1>
        </header>

        <section class="form-section">

            <h2>Insira os dados do seu investimento</h2>

            <div class="form">

                <label>Valor inicial</label>
                <input id="valorInicial" type="number" placeholder="Ex: 1000">

                <label>Aporte mensal</label>
                <input id="aporteMensal" type="number" placeholder="Ex: 300">

                <label>Taxa anual (%)</label>
                <input id="taxaAnual" type="number" step="0.01" placeholder="Ex: 10">

                <label>Período (anos)</label>
                <input id="periodo" type="number" placeholder="Ex: 10">

                <div class="buttons center">

                    <button type="button" class="btn carregar" onclick="calcularInvestimento()">
                        Calcular
                    </button>

                    <button type="button" class="btn limpar" onclick="resetarInvestimento()">
                        Resetar
                    </button>

                </div>

            </div>

        </section>

        <section>

            <div class="cards centralizado">
                <div class="card">
                    <h3>Valor investido</h3>
                    <p id="valorInvestido">R$ 0</p>
                </div>

                <div class="card">
                    <h3>Rendimentos</h3>
                    <p id="rendimentos">R$ 0</p>
                </div>

                <div class="card destaque">
                    <h3>Valor final</h3>
                    <p id="valorFinal">R$ 0</p>
                </div>
            </div>

        </section>

        <section class="charts">

            <div class="chart-box chart-wide">

                <h3>Evolução do investimento</h3>

                <div class="chart-placeholder investimento">
                    <canvas id="graficoInvestimento"></canvas>
                </div>

            </div>

        </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>

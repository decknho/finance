```html
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Investimentos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <h2 class="logo">Finance</h2>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="controle.html">Controle</a>
            <a href="simulador.html">Simulador</a>
            <a href="educacao.html">Educação</a>
        </nav>

    </aside>

    <!-- MAIN -->

    <main class="main">

        <header class="header">
            <h1>Simulador de Investimentos</h1>
        </header>

        <!-- SIMULADOR -->

        <section class="form-section">

            <h2>Simule seu investimento</h2>

            <div class="form">

                <label>Valor inicial</label>
                <input id="valorInicial" type="number" placeholder="Ex: 1000">

                <label>Aporte mensal</label>
                <input id="aporteMensal" type="number" placeholder="Ex: 300">

                <label>Taxa anual (%)</label>
                <input id="taxaAnual" type="number" step="0.01" placeholder="Ex: 10">

                <label>Período (anos)</label>
                <input id="periodo" type="number" placeholder="Ex: 10">

                <div class="buttons">

                    <button type="button" class="btn calcular" onclick="calcularInvestimento()">
                        Calcular
                    </button>

                </div>

            </div>

        </section>

        <!-- RESULTADO -->

        <section class="cards">

            <div class="card">
                <h3>Valor investido</h3>
                <p id="valorInvestido">R$ 0</p>
            </div>

            <div class="card">
                <h3>Rendimentos</h3>
                <p id="rendimentos">R$ 0</p>
            </div>

            <div class="card destaque">
                <h3>Valor final</h3>
                <p id="valorFinal">R$ 0</p>
            </div>

        </section>

        <!-- GRÁFICO -->

        <section class="charts">

            <div class="chart-box">

                <h3>Evolução do investimento</h3>

                <div class="chart-placeholder investimento">
                    <canvas id="graficoInvestimento"></canvas>
                </div>

            </div>

        </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
```
